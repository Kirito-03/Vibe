services:
  db:
    image: postgres:16-alpine
    container_name: vns_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-vibe}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-vibe}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      network: host
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
        VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID}
        VITE_IMGBB_KEY: ${VITE_IMGBB_KEY}
    container_name: vns_frontend
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  frontend_dev:
    image: node:20-alpine
    container_name: vns_frontend_dev
    profiles: ["dev"]
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      # API en blanco = Vite usará su proxy interno → http://backend:3000
      VITE_API_BASE: ""
      # Firebase (build-time vars para Vite)
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
      VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
      VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
      VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
      VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID}
      VITE_IMGBB_KEY: ${VITE_IMGBB_KEY}
      # Polling para HMR en WSL2/Windows bind mounts (evita que los cambios no se detecten)
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./:/app
      - /app/node_modules
    command: ["sh", "-lc", "npm install --prefer-offline && npm run dev -- --host 0.0.0.0 --port 5173"]
    depends_on:
      - backend
    networks:
      - internal

  convert:
    build:
      context: ./Convert
      dockerfile: Dockerfile
    container_name: vns_convert
    restart: unless-stopped
    dns:
      - 172.28.0.53
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      STORAGE_DIR: /app/downloads
      PYTHONUNBUFFERED: "1"
      YTDLP_PROXY: ${YTDLP_PROXY:-}
      YTDLP_COOKIES_PATH: /app/cookies.txt
      CONVERT_SEARCH_TIMEOUT_MS: ${CONVERT_SEARCH_TIMEOUT_MS:-15000}
      CONVERT_SEARCH_CACHE_TTL_MS: ${CONVERT_SEARCH_CACHE_TTL_MS:-900000}
      MEDIA_WORKER_URL: ${MEDIA_WORKER_URL:-}
      MEDIA_WORKER_ENABLED: ${MEDIA_WORKER_ENABLED:-false}
      MEDIA_WORKER_TIMEOUT_MS: ${MEDIA_WORKER_TIMEOUT_MS:-30000}
      MEDIA_WORKER_SEARCH_ENABLED: ${MEDIA_WORKER_SEARCH_ENABLED:-false}
    volumes:
      - mp3_storage:/app/downloads
      - ./Convert/cookies.txt:/app/cookies.txt:ro
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vns_backend
    restart: unless-stopped
    network_mode: "host"
    depends_on:
      db:
        condition: service_healthy
      convert:
        condition: service_started
    env_file:
      - ./backend/.env.docker
    environment:
      NODE_OPTIONS: "--dns-result-order=ipv4first"
      PORT: "3000"
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:-vibe}
      DB_HOST: "127.0.0.1"
      CONVERT_URL: "http://127.0.0.1:8000"
      DOWNLOADER_URL: "http://127.0.0.1:8000"
      CONVERT_TIMEOUT_MS: ${CONVERT_TIMEOUT_MS:-20000}
      MEDIA_WORKER_URL: ${MEDIA_WORKER_URL:-}
      MEDIA_WORKER_ENABLED: ${MEDIA_WORKER_ENABLED:-false}
      MEDIA_WORKER_TIMEOUT_MS: ${MEDIA_WORKER_TIMEOUT_MS:-30000}
      DEEPSEEK_RECOMMENDATIONS_ENABLED: ${DEEPSEEK_RECOMMENDATIONS_ENABLED:-false}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_TIMEOUT_MS: ${DEEPSEEK_TIMEOUT_MS:-5000}
      DEEPSEEK_MAX_QUERIES: ${DEEPSEEK_MAX_QUERIES:-8}
      RECOMMENDATION_SEEN_TTL_HOURS: ${RECOMMENDATION_SEEN_TTL_HOURS:-24}
    volumes:
      - mp3_storage:/app/downloads
      - ./backend/cla2.json:/app/cla2.json:ro

  dns:
    image: m13253/dns-over-https-client:latest
    container_name: vns_dns
    restart: unless-stopped
    expose:
      - "53/udp"
      - "53/tcp"
    networks:
      internal:
        ipv4_address: 172.28.0.53

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: vns_tunnel
    restart: unless-stopped
    command: ["tunnel", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN is required}
    extra_hosts:
      - "localhost:host-gateway"
      - "127.0.0.1:host-gateway"
    depends_on:
      - frontend
      - backend
    networks:
      - internal
      - muxivo_default
      - pixel_network

volumes:
  postgres_data:
  mp3_storage:

networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
  muxivo_default:
    external: true
  pixel_network:
    external: true
